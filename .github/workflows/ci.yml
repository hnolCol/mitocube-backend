name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          jwt_key: test-jwt-key
          jwt_share_key: test-share-key
          share_token_pw: test-share-pw
          MFA_ENCRYPTION_KEY: MuelleVfjEo1BUsHRtKSsAhF-8VkRY-tCTsNFgaAngs=
          frontend_build: src
          frontend_build_assets: src
          use_terms_file: src/app.py
          open_ai_api_key: test-key
          chat_ai_base_url: https://example.invalid
          db_pw: test-db-pw
          mail_username: test-mail
          mail_password: test-mail-pw
          mail_template_dir: src
        run: python -m pytest --cov=src --cov-report=term

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit core dependencies
        # PYSEC-2026-1325: transitive ecdsa advisory with no fix version;
        # resolves when python-jose is migrated to pyjwt (tracked separately).
        run: >-
          pip-audit -r requirements.txt --no-deps
          --ignore-vuln PYSEC-2026-1325 --ignore-vuln CVE-2026-85394
