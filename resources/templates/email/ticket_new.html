<html><body style="margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif;"><div style="width: 90%; background: #efefef; border-radius: 10px; margin: 2rem; padding: 1rem;">
  <h1>{{app_name}} : New support ticket</h1>
<p><b>{{user}}</b> submitted a new support ticket</p>
<div style="color : #0a68ad; font-size: large; text-align: center;">
<h3>{{title}}</h3>
<p style="color: #555; font-size: medium;">Ticket number <b>{{reference}}</b></p>
</div>
<p>Message:</p>
<p style="white-space: pre-wrap; background: #ffffff; border-radius: 5px; padding: 0.75rem;">{{description}}</p>
<p>Please open <a href={{url}}>{{app_name}}</a> and use the <b>Support tickets</b> button in the top bar to reply.</p>
<p>The {{app_name}} Support Team</p>
</div></body></html>
